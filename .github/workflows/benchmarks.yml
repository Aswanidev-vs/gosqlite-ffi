name: Comparative SQLite benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - 'sqliteffi/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: benchmarks/go.mod
      - name: Build matched SQLite 3.53.4 runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl
          curl --fail --location --silent --show-error \
            https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz \
            --output /tmp/sqlite-autoconf-3530400.tar.gz
          tar -xzf /tmp/sqlite-autoconf-3530400.tar.gz -C /tmp
          cd /tmp/sqlite-autoconf-3530400
          # Keep optional symbols used by SQLite's shell and common extensions available in the shared library.
          # The sqlite3 shell also references column-metadata APIs when dynamically linked.
          CFLAGS='-DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_COLUMN_METADATA' \
            ./configure --prefix=/opt/sqlite-3.53.4 --enable-shared --disable-static
          make -j2
          sudo make install
          echo "LD_LIBRARY_PATH=/opt/sqlite-3.53.4/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "/opt/sqlite-3.53.4/lib" | sudo tee /etc/ld.so.conf.d/sqlite-3.53.4.conf
          sudo ldconfig
      - name: Verify GoFFI native SQLite version
        shell: bash
        run: |
          set -euo pipefail
          version="$(LD_LIBRARY_PATH=/opt/sqlite-3.53.4/lib /opt/sqlite-3.53.4/bin/sqlite3 :memory: 'SELECT sqlite_version();')"
          echo "Native SQLite runtime: $version"
          test "$version" = "3.53.4"
      - name: Record environment
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          uname -a
          lscpu
          LD_LIBRARY_PATH=/opt/sqlite-3.53.4/lib /opt/sqlite-3.53.4/bin/sqlite3 --version
      - name: Resolve benchmark dependencies
        working-directory: benchmarks
        run: go mod tidy
      - name: Run concurrency stress tests
        working-directory: benchmarks
        run: go test ./... -run '^TestConcurrentStress$' -count=3 -timeout=10m
      - name: Run comparative benchmarks
        working-directory: benchmarks
        shell: bash
        run: |
          set -o pipefail
          go test -v ./... -run '^$' -bench '^BenchmarkDriver/' -benchmem -benchtime=2s -count=5 -timeout=30m | tee benchmark-results.txt
      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-comparative-benchmark-results
          path: benchmarks/benchmark-results.txt
          if-no-files-found: error
